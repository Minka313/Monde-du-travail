<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>Administration — Le Monde du Travail</title>
    <link rel="icon" type="image/png" href="../frontend/logo.png">
    <link rel="stylesheet" href="css/admin.css?v=2.3.1">
</head>
<body>
    <div id="admin-root" class="hidden">
        <!-- Sidebar Navigation (Drawer on mobile) -->
        <aside class="sidebar" id="admin-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <img src="../frontend/logo.png" alt="Logo" class="sidebar-logo">
                    <span>Admin LMT</span>
                </div>
                <button class="sidebar-close-btn" id="admin-sidebar-close" aria-label="Fermer le menu">&times;</button>
            </div>
            <nav class="sidebar-nav" id="admin-nav"></nav>
            <div class="sidebar-footer">
                <button class="nav-item nav-theme-item" id="admin-sidebar-theme-toggle" type="button" title="Basculer Mode Sombre / Clair">
                    <span id="sidebar-theme-toggle-icon">🌙</span> <span id="sidebar-theme-toggle-text">Mode Sombre</span>
                </button>
                <button class="nav-item nav-logout-item" id="admin-logout-btn">
                    <span>🚪</span> Déconnexion
                </button>
            </div>
        </aside>

        <!-- Backdrop for mobile drawer -->
        <div id="admin-sidebar-backdrop" class="sidebar-backdrop"></div>

        <!-- Main Content Area -->
        <div class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="admin-menu-toggle" id="admin-sidebar-toggle" aria-label="Ouvrir le menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <h1 class="topbar-title" id="admin-page-title">Tableau de bord</h1>
                </div>
                <div class="topbar-actions">
                    <button id="admin-cmd-palette-btn" class="btn btn-ghost btn-sm" style="display:inline-flex;align-items:center;gap:0.35rem;font-size:0.8rem;padding:0.4rem 0.65rem;" title="Recherche rapide (Ctrl + K)">
                        <span>🔍</span> <span style="opacity:0.75;font-size:0.75rem;border:1px solid currentColor;padding:1px 5px;border-radius:4px;">Ctrl K</span>
                    </button>
                    <button id="admin-theme-toggle" class="btn btn-ghost btn-sm" style="font-size:1.1rem;padding:0.4rem 0.6rem;" title="Basculer Mode Sombre / Clair">
                        <span id="theme-toggle-icon">🌙</span>
                    </button>
                    <span class="topbar-user" id="admin-user-name"></span>
                    <a href="../frontend/index.html" class="btn btn-ghost btn-sm topbar-site-link">
                        <span>🌐</span> <span class="site-link-text">Voir le site</span>
                    </a>
                </div>
            </header>
            <main class="content" id="admin-content"></main>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="admin-loading" class="loading-screen">
        <div style="text-align:center;">
            <div style="font-size:1.25rem;font-weight:600;">Vérification de la session...</div>
            <div style="color:var(--color-muted);margin-top:0.5rem;">Merci de patienter</div>
        </div>
    </div>

    <!-- Access Denied Screen -->
    <div id="admin-denied" class="access-denied-screen hidden">
        <div style="text-align:center;max-width:480px;padding:2.5rem;background:#ffffff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.08);margin:2rem auto;">
            <h2 style="color:var(--color-danger, #ef4444);margin-bottom:0.5rem;">Accès refusé</h2>
            <p style="color:var(--color-muted, #64748b);margin:1rem 0 1.5rem 0;">Ce compte n'a pas les droits nécessaires pour accéder à l'administration.<br>Veuillez vous connecter avec un compte administrateur.</p>
            <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
                <a href="login.html" class="btn btn-primary" onclick="if(window.AdminApi) window.AdminApi.removeTokens();">Connexion Administrateur</a>
                <button type="button" class="btn btn-secondary" onclick="if(window.AdminApp) window.AdminApp.logout(); else { localStorage.removeItem('adminAccessToken'); localStorage.removeItem('accessToken'); window.location.href='login.html'; }">Changer de compte</button>
                <a href="../frontend/index.html" class="btn btn-outline">Retour au site</a>
            </div>
        </div>
    </div>

    <script src="js/admin-auth.js?v=2.3.1"></script>
    <script src="js/admin-app.js?v=2.3.1"></script>
    <script src="js/admin-pages.js?v=2.3.1"></script>
    <script src="js/admin-router.js?v=2.3.1"></script>
    <script>
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => window.AdminRouter.init());
        } else {
            window.AdminRouter.init();
        }
    </script>
</body>
</html>
